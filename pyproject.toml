[project]
name = "einstein-test"
version = "0.1.0"
description = "FastAPI hello world + Alembic configurado"
readme = "README.md"
authors = [
    { name = "Pedronxw", email = "pedroalmeidan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
einstein-test = "einstein_test:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
