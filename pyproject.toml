[project]
name = "einstein-test"
version = "0.1.0"
description = "FastAPI hello world + Alembic configurado"
readme = "README.md"
authors = [
    { name = "Pedronxw", email = "pedroalmeidan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "bcrypt>=5.0.0",
    "boto3>=1.43.119",
    "celery>=5.6.3",
    "email-validator>=2.3.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "openai>=3.39.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.15.1",
    "pypdf>=6.21.3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
einstein-test = "einstein_test.main:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: testes end-to-end com provedor real (requer OPENAI_API_KEY + RUN_INTEGRATION=1 + infra)",
]
addopts = "-m \"not integration\""

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
"src/einstein_test/models/**" = ["F401"]

[tool.coverage.run]
source = ["einstein_test"]
omit = [
    "einstein_test/main.py",
    "einstein_test/settings.py",
    "einstein_test/middleware/*",
    "einstein_test/storage/minio.py",
    "einstein_test/logging_setup.py",
    "einstein_test/tasks/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
