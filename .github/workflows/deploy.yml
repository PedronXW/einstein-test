name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente-alvo do deploy"
        required: true
        default: "prod"
        type: choice
        options:
          - prod

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  infra:
    name: infra (terraform)
    runs-on: ubuntu-latest
    env:
      TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/einstein-${{ inputs.environment }}-github-infra
          aws-region: us-east-1

      - name: Debug OIDC claims (diagnóstico)
        if: always()
        run: |
          TOKEN_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com"
          TOKEN="$(curl -s -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${TOKEN_URL}" | jq -r .value)"
          PAYLOAD="$(printf '%s' "$TOKEN" | cut -d. -f2 | tr '_-' '/+')"
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          CLAIMS="$(printf '%s' "$PAYLOAD" | base64 -d 2>/dev/null)"
          echo "OIDC sub: $(printf '%s' "$CLAIMS" | jq -r .sub)"
          echo "OIDC aud: $(printf '%s' "$CLAIMS" | jq -r .aud)"
          echo "OIDC iss: $(printf '%s' "$CLAIMS" | jq -r .iss)"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Terraform plan + apply
        working-directory: terraform
        run: |
          terraform init -input=false
          terraform plan -input=false -var-file=envs/${{ inputs.environment }}.tfvars -out=tfplan
          terraform apply -input=false tfplan

  app:
    name: app (ECR + ECS rollout)
    needs: infra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/einstein-${{ inputs.environment }}-github-app
          aws-region: us-east-1

      - name: Resolve ECR registry
        id: registry
        run: |
          account="$(aws sts get-caller-identity --query Account --output text)"
          echo "registry=${account}.dkr.ecr.us-east-1.amazonaws.com" >> "$GITHUB_OUTPUT"

      - name: Login to ECR
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.registry }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.registry.outputs.registry }}/einstein-test-prod:prod-${{ github.sha }}
            ${{ steps.registry.outputs.registry }}/einstein-test-prod:latest

      - name: Rollout ECS (api + worker)
        run: ./deploy/rollout.sh ${{ inputs.environment }} \
          "${{ steps.registry.outputs.registry }}/einstein-test-prod:prod-${{ github.sha }}"
        env:
          AWS_REGION: us-east-1